name: "Frogbot Scan Repository"

on:
  push:
    branches:
      - "main"
  schedule:
    - cron: "56 3 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to scan."
        type: string
        required: false
        default: "main"

jobs:
  scan-repository:
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      # Required for the OIDC token exchange with the JFrog platform.
      id-token: write
    uses: keyshot-dev/.github/.github/workflows/frogbot-reusable.yml@main
    with:
      branch: ${{ inputs.branch || 'main' }}
      oidc_provider_name: keyshot-dev-github
    secrets:
      JF_URL: ${{ secrets.JF_URL }}
